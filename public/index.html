<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TravelGuard24</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#131a22; --panel2:#0f151c; --line:#1f2833; --ink:#e6edf3; --dim:#7d8896;
    --ok:#3fb950; --no:#f85149; --hi:#58a6ff; --warn:#e3b341;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;overflow:hidden}
  .grid{display:grid;grid-template-columns:250px 1fr 310px;height:100vh}
  .col{padding:22px 20px;overflow-y:auto}
  .col+.col{border-left:1px solid var(--line)}
  h2{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .sub{font-size:11.5px;color:var(--dim);margin:3px 0 16px}

  /* ── A ── */
  .rule{padding:10px 0;border-bottom:1px solid var(--line)}
  .rule .k{font-size:11.5px;color:var(--dim)}
  .rule .v{font-size:13.5px;margin-top:1px}
  .scope{margin-top:16px;padding:9px 10px;border:1px dashed var(--line);border-radius:6px;font-size:11px;color:var(--dim);line-height:1.45}

  /* ── B ── */
  .mid{display:flex;flex-direction:column;height:100%}
  .prompt{display:flex;gap:8px}
  input[type=text]{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:11px 13px;border-radius:8px;font-size:13.5px}
  button{background:var(--hi);border:0;color:#04121f;font-weight:600;padding:11px 20px;border-radius:8px;cursor:pointer;font-size:13.5px}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:500;padding:4px 9px;font-size:11px;border-radius:5px}
  button.ghost.on{border-color:var(--warn);color:var(--warn)}
  button:disabled{opacity:.35;cursor:default}
  .opts{font-size:11px;color:var(--dim);margin:9px 0 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

  .flow{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
  .step{border:1px solid var(--line);border-radius:9px;background:var(--panel2);animation:in .22s ease}
  .step.live{background:var(--panel);border-color:#2b3846}
  @keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .step .hd{display:flex;align-items:center;gap:9px;padding:8px 13px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .step .hd .n{width:17px;height:17px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:9.5px;letter-spacing:0}
  .step.done .hd .n{border-color:var(--ok);color:var(--ok)}
  .step.stop .hd .n{border-color:var(--warn);color:var(--warn)}
  .step .hd .sum{margin-left:auto;font-family:var(--mono);font-size:11px;text-transform:none;letter-spacing:0;color:var(--dim)}
  .step .bd{padding:0 13px 12px 39px}

  .tick{font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.85}
  .tick b{color:var(--ink);font-weight:500}
  .price{font-size:26px;font-weight:600;letter-spacing:-.02em}
  .carrier{font-size:15px}
  .meta{font-size:11.5px;color:var(--dim)}

  table.checks{width:100%;font-family:var(--mono);font-size:12px;border-collapse:collapse}
  table.checks td{padding:3px 0;vertical-align:top}
  table.checks td:first-child{width:17px}
  table.checks td.lbl{color:var(--dim);width:158px}
  .pass{color:var(--ok)} .fail{color:var(--no)}
  .chk{animation:in .3s ease}
  .said{font-size:15px;line-height:1.5;color:var(--ink)}
  .why{font-size:11.5px;color:var(--dim);margin-top:9px;font-family:var(--mono)}
  .banner{margin-top:11px;padding:10px 12px;border-radius:7px;background:#1b1405;border:1px solid #3d2f08;font-size:12.5px}
  .banner b{color:var(--warn)}
  .banner.blue{background:#061524;border-color:#12314d}
  .banner.blue b{color:var(--hi)}
  .hero{font-size:12.5px}
  .hero b{font-family:var(--mono);font-size:14px}

  /* ── C ── */
  .entry{padding:8px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;animation:in .25s ease}
  .entry .top{display:flex;justify-content:space-between;gap:8px;color:var(--ink)}
  .entry .lnk{color:var(--dim);margin-top:2px;font-size:10.5px}
  .entry.block .top{color:var(--warn)}
  .foot{margin-top:13px;font-size:10.5px;color:var(--dim)}
  .empty{color:var(--dim);font-size:11.5px;font-style:italic}
</style>
</head>
<body>
<div class="grid">

  <div class="col">
    <h2>Travel Policy</h2>
    <div class="sub" id="org">—</div>
    <div id="rules"></div>
    <div class="scope">No exception/override path in v1<br><span style="opacity:.65">declared out of scope</span></div>
  </div>

  <div class="col mid">
    <h2>Agent</h2>
    <div class="sub">Searches, checks policy, and only then requests payment.</div>
    <div class="prompt">
      <input type="text" id="q" value="Book me SYD to LHR return, 15-25 Sept, economy" />
      <button id="go">Send</button>
    </div>
    <div class="opts">
      Try:
      <button class="ghost ex" data-say="Book me SYD to LHR return, 15-25 Sept, economy">economy trip</button>
      <button class="ghost ex" data-say="Book me business class SYD to LHR, 15-25 Sept - it's a long flight">business class</button>
      <button class="ghost ex" data-say="Need to get to London from Sydney, 15-25 Sept, under $1,200">vague + budget</button>
    </div>
    <div class="opts" style="margin-top:-4px">
      <span style="opacity:.55">demo control ·</span> tamper the credential:
      <button class="ghost on" data-tamper="none">off</button>
      <button class="ghost" data-tamper="amount">amount</button>
      <button class="ghost" data-tamper="merchant">merchant</button>
      <button class="ghost" data-tamper="replay">replay</button>
    </div>
    <div class="flow" id="flow"></div>
  </div>

  <div class="col">
    <h2>Audit Log</h2>
    <div class="sub">Every attempt, including refusals.</div>
    <div id="log"><div class="empty">No entries yet.</div></div>
    <div class="foot">SHA-256 chain · tamper-evident ordering</div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const flow = $('#flow'), log = $('#log');
let tamper = 'none', entries = 0, n = 0;
let ticker = null, refusals = 0, checkout = null;
const money = (m,c) => (m/100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',') + ' ' + c;
const esc = (s) => String(s).replace(/[<&]/g, (c) => (c==='<'?'&lt;':'&amp;'));

fetch('/policy').then(r=>r.json()).then(p=>{
  $('#org').textContent = `${p.org} · ${p.version} · 4 rules active`;
  $('#rules').innerHTML = [
    ['Budget cap', money(p.budgetCapMinor,p.currency)+' per booking'],
    ['Cabin class', p.allowedCabinClasses.join(', ')+' only'],
    ['Advance purchase', '≥ '+p.minAdvanceDays+' days before departure'],
    ['Vendor allowlist', p.vendorAllowlist.length+' approved carriers'],
  ].map(([k,v])=>`<div class="rule"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
});

document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{ $('#q').value=b.dataset.say; });
document.querySelectorAll('[data-tamper]').forEach(b=>b.onclick=()=>{tamper=b.dataset.tamper;
  document.querySelectorAll('[data-tamper]').forEach(x=>x.classList.toggle('on',x===b));});

$('#go').onclick = () => {
  flow.innerHTML=''; log.innerHTML='<div class="empty">No entries yet.</div>';
  entries=0; n=0; refusals=0; $('#go').disabled=true;
  clearInterval(ticker); ticker=null;
  fetch('/book',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({instruction:$('#q').value,tamper})});
};

/* Steps accumulate. Finished ones collapse to a one-line summary so the whole
   journey stays on screen without scrolling — the rules, the decision and the
   evidence have to be visible together, that simultaneity is the point. */
const TITLES={ask:'Request',read:'Understanding',search:'Discovery',gate:'Policy gate',
              hold:'Reservation',auth:'Authorisation',guard:'Mandate enforcement',
              settle:'Settlement',done:'Confirmed'};

function step(id){
  let el = document.getElementById('s-'+id);
  if(!el){
    el = document.createElement('div');
    el.className='step live'; el.id='s-'+id;
    el.innerHTML=`<div class="hd"><span class="n">${++n}</span><span>${TITLES[id]||id}</span><span class="sum"></span></div><div class="bd"></div>`;
    flow.appendChild(el); flow.scrollTop = flow.scrollHeight;
  }
  return el;
}
const body = (id) => step(id).querySelector('.bd');
function close(id, summary, kind){
  const el = document.getElementById('s-'+id); if(!el) return;
  el.classList.remove('live'); el.classList.add(kind||'done');
  el.querySelector('.hd .n').textContent = kind==='stop' ? '!' : '✓';
  if(summary!==undefined){ el.querySelector('.sum').textContent = summary; el.querySelector('.bd').innerHTML=''; }
}

/* The funnel, revealed one rule at a time.
   The numbers are real and already computed — only the reveal is paced. A funnel that
   appears complete in a single frame reads as a summary; one that empties step by step
   reads as rules being applied, which is what actually happened. Same reasoning as the
   sequential guardrail reveal below.
   Truncated at the first zero, naming the rule that emptied it: a run of repeated zeros
   reads as a rendering fault rather than a funnel. */
function revealFunnel(el, total, funnel, then){
  el.textContent = String(total);
  const steps=[];
  for(const f of funnel){
    steps.push(f);
    if(f.remaining===0) break;
  }
  steps.forEach((f,i)=>setTimeout(()=>{
    el.insertAdjacentHTML('beforeend',
      ` → ${f.remaining}` + (f.remaining===0
        ? ` <span style="opacity:.8">— all excluded at ${f.rule.replace(/_/g,' ')}</span>` : ''));
    if(i===steps.length-1) setTimeout(then, 260);
  }, 260*(i+1)));
  if(steps.length===0) setTimeout(then, 0);
}

const ruleRows = (rules) => rules.map(r=>`<tr>
  <td class="${r.passed?'pass':'fail'}">${r.passed?'✓':'✕'}</td>
  <td class="lbl">${r.rule.replace(/_/g,' ')}</td>
  <td>${r.observed}${r.passed?'':` <span class="fail">— ${r.detail||r.expected}</span>`}</td></tr>`).join('');

function addAudit(e){
  if(entries++===0) log.innerHTML='';
  const blocked = e.event==='POLICY_BLOCKED'||e.event==='REDEMPTION_REJECTED';
  log.insertAdjacentHTML('afterbegin',
    `<div class="entry ${blocked?'block':''}">
       <div class="top"><span>#${e.seq} ${e.event}</span><span>${new Date(e.at).toLocaleTimeString('en-GB')}</span></div>
       <div class="lnk">${e.hash.slice(0,8)}… ← prev ${e.prevHash?e.prevHash.slice(0,8)+'…':'genesis'}</div>
     </div>`);
}

new EventSource('/events').onmessage = (m) => {
  const e = JSON.parse(m.data);

  if(e.type==='instructed'){
    body('ask').innerHTML = `<div class="said">“${e.text}”</div>`;
    close('ask', undefined);
  }

  if(e.type==='understood'){
    const i=e.intent;
    const cab = i.cabinClass.replace('_',' ');
    body('read').innerHTML =
      `<table class="checks">
         <tr><td></td><td class="lbl">route</td><td><b>${i.origin} → ${i.destination}</b> return</td></tr>
         <tr><td></td><td class="lbl">dates</td><td>${i.departureDate} → ${i.returnDate}</td></tr>
         <tr><td></td><td class="lbl">cabin</td><td><b>${cab}</b></td></tr>
         ${i.statedBudget?`<tr><td></td><td class="lbl">traveller's budget</td><td>${i.statedBudget} <span class="meta">— a preference, not the policy</span></td></tr>`:''}
       </table>
       ${i.assumptions.length?`<div class="why">Assumed: ${i.assumptions.join(' · ')}</div>`:''}`;
    close('read', `${i.origin}→${i.destination} · ${cab}`);
  }

  /* A live return search takes 15–25s. Left as a static line that is the longest
     silence in the demo, and silence on screen reads as a hang. An honest elapsed
     counter costs nothing and shows the wait belongs to the vendor, not to us. */
  if(e.type==='searching'){
    const q=e.query;
    body('search').innerHTML =
      `<div class="tick">${q.origin} → ${q.destination} · ${q.departureDate} → ${q.returnDate} · ${q.cabinClass.replace('_',' ')}</div>
       <div class="tick">Querying Duffel <b id="el">0.0s</b></div>
       <div class="why">Every carrier serving the route is quoted. Fares that cannot be held are dropped before the gate sees them — a vendor limit, not a policy one.</div>`;
    const t0=Date.now();
    clearInterval(ticker);
    ticker=setInterval(()=>{
      const el=document.getElementById('el');
      if(!el){ clearInterval(ticker); ticker=null; return; }
      el.textContent=((Date.now()-t0)/1000).toFixed(1)+'s';
    },100);
  }

  if(e.type==='searched'){
    clearInterval(ticker); ticker=null;
    body('search').innerHTML =
      `<div class="tick"><b>${e.offers}</b> bookable offers · <b>${e.carriers}</b> airlines <span class="meta">in ${(e.ms/1000).toFixed(1)}s</span></div>`;
    close('search', `${e.offers} offers / ${e.carriers} airlines`);
  }

  if(e.type==='decided'){
    const d=e.decision;
    body('gate').innerHTML =
      `<div class="tick" style="margin-bottom:9px">Evaluating 4 rules … <b id="fn"></b></div>
       <div id="verdict" style="opacity:0;transition:opacity .3s ease"></div>`;
    const verdict = document.getElementById('verdict');

    if(d.outcome==='APPROVED'){
      const s=d.selected;
      verdict.innerHTML =
        `<div class="carrier">${s.carrier.name} <span class="meta">(${s.carrier.iata})</span></div>
         <div class="price" style="margin:2px 0 8px">${s.totalAmount} <span class="meta" style="font-size:13px">${s.currency}</span></div>
         <table class="checks">${ruleRows(s.rules)}</table>
         ${d.runnerUp?`<div class="why">Chose ${s.carrier.name} at ${s.totalAmount} over ${d.runnerUp.carrier.name} at ${d.runnerUp.totalAmount} — cheapest compliant</div>`:''}`;
      revealFunnel(document.getElementById('fn'), d.totalOffers, d.funnel, ()=>{
        verdict.style.opacity='1';
        const g=document.getElementById('s-gate'); if(!g) return;
        g.classList.remove('live'); g.classList.add('done');
        g.querySelector('.hd .n').textContent='✓';
        g.querySelector('.hd .sum').textContent = `${s.totalAmount} ${s.currency}`;
      });
    } else {
      const nm=d.nearestMiss, ch=d.cheapestOverall;
      verdict.innerHTML =
        `<div class="carrier meta">Nearest miss — <span style="color:var(--ink)">${nm?.carrier.name??'—'}</span></div>
         <div class="price" style="margin:2px 0 8px;color:var(--warn)">${nm?.totalAmount??'—'} <span class="meta" style="font-size:13px">${nm?.currency??''}</span></div>
         <table class="checks">${nm?ruleRows(nm.rules.filter(r=>!r.passed)):''}</table>
         <div class="why">${d.totalOffers} offers evaluated. None compliant.${ch&&ch.offerId!==nm?.offerId?`<br>Cheapest available ${ch.totalAmount} ${ch.currency} — ${ch.failedRules.length} rules short.`:''}</div>
         <div class="banner"><b>No payment session was created.</b> The agent did not fail to pay — it declined to.</div>`;
      revealFunnel(document.getElementById('fn'), d.totalOffers, d.funnel, ()=>{
        verdict.style.opacity='1';
        close('gate', undefined, 'stop');
        document.querySelector('#s-gate .hd .sum').textContent = 'BLOCKED';
      });
    }
  }

  /* The hold step has two parts: a running list of airlines that refused, and the
     current attempt. They are separate elements because the refusals must survive the
     successful render — overwriting them would erase the reason the booking landed on
     a carrier that was not the cheapest, which is exactly what the audit entry records
     and what a judge would ask about. */
  function holdParts(){
    const bd = body('hold');
    if(!document.getElementById('h-list'))
      bd.innerHTML = `<div id="h-list"></div><div id="h-now"></div>`;
    return { list: document.getElementById('h-list'), now: document.getElementById('h-now') };
  }

  if(e.type==='holding')
    holdParts().now.innerHTML =
      `<div class="tick">Reserving seats with <b>${e.carrier}</b><b> …</b></div>`;

  if(e.type==='hold_refused'){
    refusals++;
    const p = holdParts();
    p.now.innerHTML='';
    p.list.insertAdjacentHTML('beforeend',
      `<div class="tick" style="color:var(--warn)">✕ <b>${e.carrier}</b> refused the hold
         <span class="meta">— ${esc(e.reason).slice(0,90)}</span></div>
       <div class="why" style="margin:0 0 6px">Falling back to the next compliant offer. Every candidate already passed the policy gate, so the decision is unchanged.</div>`);
  }

  if(e.type==='held'){
    holdParts().now.innerHTML =
      `<div class="tick">PNR <b>${e.pnr}</b> · ${e.carrier} · ${e.amount} ${e.currency} <span class="meta">— reserved, nothing paid yet</span></div>`;
    // Keep the refusals visible in the collapsed summary; they explain the carrier.
    const el = document.getElementById('s-hold');
    if(el){
      el.classList.remove('live'); el.classList.add('done');
      el.querySelector('.hd .n').textContent='✓';
      el.querySelector('.hd .sum').textContent =
        refusals ? `PNR ${e.pnr} · ${refusals} refused` : `PNR ${e.pnr}`;
    }
  }

  /* The checkout opens as a positioned popup rather than a tab, so the handoff reads as
     a payment modal over the agent instead of navigating away from it. It cannot be an
     iframe: Visa sends `frame-ancestors none` and blocks delegated WebAuthn, deliberately.
     A popup opened from a server-sent event has no user gesture behind it, so a blocker
     can refuse it — hence the explicit button, which doubles as the way back in if the
     window gets closed mid-tap. */
  if(e.type==='awaiting_passkey'){
    body('auth').innerHTML =
      `<div class="price">${e.amount} <span class="meta" style="font-size:13px">${e.currency}</span></div>
       <div class="tick">TravelGuard24 · one-time · locked to this merchant and this exact amount</div>
       <div class="banner blue" id="pk"><b>Waiting for passkey…</b> Visa-hosted prompt open.
         <button class="ghost" id="reopen" style="margin-left:6px">open checkout</button></div>`;
    const open = () => {
      const w = 520, h = 780;
      checkout = window.open(e.iframeUrl, 'prava-checkout',
        `width=${w},height=${h},left=${Math.round((screen.width-w)/2)},top=${Math.round((screen.height-h)/2)}`);
      if(!checkout) document.getElementById('pk').innerHTML =
        `<b>Popup blocked.</b> Click to open the Visa-hosted checkout.
         <button class="ghost" id="reopen" style="margin-left:6px">open checkout</button>`;
      document.getElementById('reopen').onclick = open;
    };
    open();
  }

  if(e.type==='redeemed'){
    close('auth','authorised');
    try{ checkout?.close(); }catch{} checkout=null;
    // The policy checks and any hold refusals have had the whole passkey wait to be
    // read. Collapse them now so the final screen fits without scrolling — that screen
    // is the submission screenshot, and a cut-off first step reads as a broken layout.
    // Both keep their header summary, so nothing is lost, only folded.
    for(const id of ['s-gate','s-hold']){
      const el=document.getElementById(id);
      if(el) el.querySelector('.bd').innerHTML='';
    }
    const el = body('guard'); el.innerHTML = `<table class="checks" id="gt"></table>`;
    // Revealed one at a time — simultaneous ticks read as decoration, sequential
    // ticks read as enforcement.
    e.redemption.checks.forEach((c,i)=>setTimeout(()=>{
      document.getElementById('gt')?.insertAdjacentHTML('beforeend',
        `<tr class="chk"><td class="${c.passed?'pass':'fail'}">${c.passed?'✓':'✕'}</td>
         <td class="lbl">${c.check.replace(/_/g,' ')}</td>
         <td>${c.observed}${c.passed?'':` <span class="fail">— expected ${c.expected}</span>`}</td></tr>`);
      if(i===e.redemption.checks.length-1){
        if(!e.redemption.accepted){
          el.insertAdjacentHTML('beforeend','<div class="banner"><b>Rejected.</b> Credential refused — the airline is never paid.</div>');
          close('guard', undefined,'stop');
          document.querySelector('#s-guard .hd .sum').textContent='REJECTED';
        } else close('guard','3 checks passed');
      }
    }, 420*i));
  }

  if(e.type==='settling') body('settle').innerHTML = `<div class="tick">Paying airline via Duffel balance<b> …</b></div>`;

  if(e.type==='ticketed'){
    close('settle','settled');
    body('done').innerHTML =
      `<table class="checks hero">
         <tr><td class="pass">✓</td><td class="lbl">PNR</td><td><b>${e.pnr}</b></td></tr>
         <tr><td class="pass">✓</td><td class="lbl">E-ticket</td><td>issued${e.eTicketNumber?` <span class="meta">(${e.eTicketNumber})</span>`:''}</td></tr>
         <tr><td class="pass">✓</td><td class="lbl">Mandate</td><td>closed · visa_confirmation SUCCESS</td></tr>
         <tr><td class="pass">✓</td><td class="lbl">Audit</td><td>${entries} entries · chain verified</td></tr>
       </table>`;
    close('done', undefined);
    document.querySelector('#s-done .hd .n').textContent='✓';
  }

  if(e.type==='audit') addAudit(e);

  /* Every way the flow can stop, said plainly.
     Without this a run that halts leaves the last step spinning — during the Visa
     cryptogram outage the screen sat on "Waiting for passkey…" indefinitely while the
     orchestrator had already stopped correctly. A halt that protects an invariant is
     worth showing: it is the same claim as the blocked path, made at the payment layer. */
  const HALTS = {
    NO_BOOKABLE_OFFER: ['Every compliant offer was refused a hold by its airline.',
      'No payment session was created. Policy approved these fares; the carriers would not reserve them.'],
    AUTHORISATION_TIMED_OUT: ['The passkey was never completed.',
      'No credential was issued, so the airline is never paid and the hold simply expires.'],
    AUTHORISATION_FAILED: ['Prava could not issue a credential.',
      'No mandate exists, so settlement never fires. The hold expires unpaid.'],
    REPORT_REJECTED: ['The network did not confirm the payment.',
      'Settlement is not attempted on an unconfirmed mandate.'],
    PRICE_DRIFTED: ['The price moved between quote and order.',
      'A moving price stops the booking rather than minting a mandate for a number nobody approved.'],
    SETTLEMENT_FAILED: ['Leg 1 completed but the airline could not be paid.',
      'Recorded loudly for manual resolution — production would refund.'],
    ERROR: ['The run stopped on an error.', ''],
  };

  if(e.type==='finished'){
    $('#go').disabled=false;
    clearInterval(ticker); ticker=null;
    try{ checkout?.close(); }catch{} checkout=null;
    const halt = HALTS[e.status];
    if(halt){
      // Nothing may be left mid-animation once the run has stopped.
      document.querySelectorAll('.step.live').forEach(el=>{
        el.classList.remove('live'); el.classList.add('stop');
        el.querySelector('.hd .n').textContent='!';
      });
      TITLES.halt = 'Stopped';
      body('halt').innerHTML =
        `<div class="said" style="font-size:13.5px">${halt[0]}</div>
         ${halt[1]?`<div class="banner"><b>No money moved.</b> ${halt[1]}</div>`:''}
         ${typeof e.detail==='string'?`<div class="why">${esc(e.detail).slice(0,160)}</div>`:''}`;
      close('halt', undefined, 'stop');   // undefined keeps the body; the summary is set below
      document.querySelector('#s-halt .hd .sum').textContent = e.status;
    }
    flow.scrollTop=flow.scrollHeight;
  }
};
</script>
</body>
</html>
